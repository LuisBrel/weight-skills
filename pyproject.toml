[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "weight-skills"
version = "0.1.0"
description = "Zero-token procedural skills for local LLMs: compile agent procedures into hot-swappable, orthogonal weight cartridges."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luis Machado" }]
keywords = ["llm", "lora", "mlx", "agents", "prompt-engineering", "wssc", "apple-silicon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "safetensors>=0.4.2",
]

[project.optional-dependencies]
mlx = ["mlx>=0.20", "mlx-lm>=0.20"]
torch = ["torch>=2.1"]
proxy = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/luisbrel/weight-skills"
Repository = "https://github.com/luisbrel/weight-skills"
Issues = "https://github.com/luisbrel/weight-skills/issues"

[project.scripts]
weight-skills = "weight_skills.cli.main:main"
weight-skills-mcp = "weight_skills.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weight_skills"]

[tool.hatch.build.targets.sdist]
include = ["src/weight_skills", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]
